[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=-Tboot/linker.ld",
    "-C", "link-arg=-no-pie",
]

[target.aarch64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=-Tboot/linker_aarch64.ld",
    "-C", "link-arg=-no-pie",
]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Ring Glow Cyan Gradient -->
    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Beaver Amber/Bronze Gradient -->
    <linearGradient id="beaverAmber2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Beaver Deep Fur Gradient -->
    <linearGradient id="beaverDeep2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Text Gradient for OS -->
    <linearGradient id="osGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Banner Background Card -->
  <rect x="0" y="0" width="960" height="320" rx="20" fill="url(#bgBanner)" stroke="#1E293B" stroke-width="2"/>

  <!-- ================= EMBLEM BADGE (X: 40..280, Y: 40..280) ================= -->
  <g transform="translate(40, 40) scale(0.46875)">
    <!-- Background Circle Badge -->
    <circle cx="256" cy="256" r="240" fill="#111827" stroke="#1E293B" stroke-width="6"/>

    <!-- Micro-Kernel Rings -->
    <circle cx="256" cy="256" r="226" fill="none" stroke="url(#cyanGrad2)" stroke-width="6" stroke-dasharray="120 18 40 18 80 18"/>
    <circle cx="256" cy="256" r="212" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.35"/>

    <!-- Left Ear -->
    <path d="M 172 176 C 148 140 152 110 180 114 C 200 117 210 138 214 162 Z" fill="url(#beaverDeep2)" stroke="#B45309" stroke-width="4"/>
    <path d="M 176 166 C 160 144 164 126 182 128 C 194 130 198 144 200 158 Z" fill="#F59E0B" opacity="0.6"/>

    <!-- Right Ear -->
    <path d="M 340 176 C 364 140 360 110 332 114 C 312 117 302 138 298 162 Z" fill="url(#beaverDeep2)" stroke="#B45309" stroke-width="4"/>
    <path d="M 336 166 C 352 144 348 126 330 128 C 318 130 314 144 312 158 Z" fill="#F59E0B" opacity="0.6"/>

    <!-- Beaver Head Shape -->
    <path d="M 198 156 C 230 146 282 146 314 156 C 354 172 376 214 380 256 C 384 298 360 340 336 366 C 298 404 214 404 176 366 C 152 340 128 298 132 256 C 136 214 158 172 198 156 Z" 
          fill="url(#beaverAmber2)" stroke="#FBBF24" stroke-width="4"/>

    <!-- Cheeks Shadow -->
    <path d="M 134 266 C 146 324 178 362 214 382 C 180 360 150 320 142 270 Z" fill="#92400E" opacity="0.45"/>
    <path d="M 378 266 C 366 324 334 362 298 382 C 332 360 362 320 370 270 Z" fill="#92400E" opacity="0.45"/>

    <!-- Crown Mark -->
    <polygon points="256,162 278,206 256,220 234,206" fill="url(#beaverDeep2)"/>
    <polygon points="256,172 270,202 256,212 242,202" fill="#00E5FF" filter="url(#glowCyan)"/>

    <!-- Eyes -->
    <circle cx="206" cy="232" r="14" fill="#0F172A"/>
    <circle cx="208" cy="230" r="11" fill="#0284C7"/>
    <circle cx="210" cy="228" r="5" fill="#00E5FF"/>
    <circle cx="212" cy="226" r="2" fill="#FFFFFF"/>

    <circle cx="306" cy="232" r="14" fill="#0F172A"/>
    <circle cx="304" cy="230" r="11" fill="#0284C7"/>
    <circle cx="302" cy="228" r="5" fill="#00E5FF"/>
    <circle cx="300" cy="226" r="2" fill="#FFFFFF"/>

    <!-- Snout -->
    <ellipse cx="256" cy="300" rx="64" ry="44" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    <path d="M 238 274 C 248 270 264 270 274 274 C 278 284 266 296 256 298 C 246 296 234 284 238 274 Z" fill="#0F172A"/>
    <circle cx="252" cy="276" r="2.5" fill="#94A3B8"/>

    <path d="M 256 298 L 256 316" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
    <path d="M 234 316 C 244 322 256 322 256 316 C 256 322 268 322 278 316" stroke="#0F172A" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Teeth -->
    <path d="M 243 320 L 254 320 L 254 348 C 254 350 252 352 249 352 L 243 352 C 241 352 240 350 240 348 L 240 323 C 240 321 241 320 243 320 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <path d="M 258 320 L 269 320 C 271 320 272 321 272 323 L 272 348 C 272 350 271 352 269 352 L 263 352 C 260 352 258 350 258 348 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>

    <!-- Whiskers -->
    <line x1="184" y1="292" x2="132" y2="284" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="182" y1="304" x2="124" y2="306" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="186" y1="316" x2="136" y2="328" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="328" y1="292" x2="380" y2="284" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="330" y1="304" x2="388" y2="306" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="326" y1="316" x2="376" y2="328" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Digital Water Crest -->
    <path d="M 120 408 C 168 392 216 418 256 408 C 296 398 344 424 392 408 C 424 430 380 448 340 442 C 296 436 256 448 212 442 C 168 436 100 432 120 408 Z" 
          fill="url(#cyanGrad2)" filter="url(#glowCyan)"/>
  </g>

  <!-- ================= TYPOGRAPHY (X: 320, Y: 100..250) ================= -->
  <!-- "BEAVER" in Pure Modern Geometric Bold Type -->
  <text x="320" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="84" letter-spacing="4" fill="#FFFFFF">BEAVER</text>
  
  <!-- "OS" with Cyan Gradient Accent -->
  <text x="730" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="84" letter-spacing="4" fill="url(#osGrad)">OS</text>

  <!-- Micro-Kernel Accent Divider Line -->
  <line x1="322" y1="192" x2="880" y2="192" stroke="url(#cyanGrad2)" stroke-width="3" stroke-linecap="round" filter="url(#glowCyan)"/>

  <!-- Subtitle Tagline -->
  <text x="324" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="22" letter-spacing="6" fill="#94A3B8">RESILIENT BARE-METAL MICRO-KERNEL</text>

  <!-- Feature Pills / Badges -->
  <g transform="translate(324, 252)">
    <!-- Pill 1: x86_64 -->
    <rect x="0" y="0" width="90" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="45" y="17" font-family="monospace" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">x86_64</text>

    <!-- Pill 2: Ring 3 Isolation -->
    <rect x="100" y="0" width="130" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="165" y="17" font-family="monospace" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle">RING 3 SANDBOX</text>

    <!-- Pill 3: POSIX Syscalls -->
    <rect x="240" y="0" width="120" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="300" y="17" font-family="monospace" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">POSIX SYSCALLS</text>

    <!-- Pill 4: BeaverFS -->
    <rect x="370" y="0" width="100" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="420" y="17" font-family="monospace" font-size="12" font-weight="700" fill="#00E5FF" text-anchor="middle">BEAVERFS</text>
  </g>
</svg>

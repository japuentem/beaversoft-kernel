<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgBanner2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060C14"/>
      <stop offset="60%" stop-color="#0B1320"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing Cyan Filters & Gradients -->
    <linearGradient id="neonCyan2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <!-- Glowing Amber Gold Gradient -->
    <linearGradient id="amberGold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="osCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="neonGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Background Card -->
  <rect x="0" y="0" width="960" height="320" rx="20" fill="url(#bgBanner2)" stroke="#1E293B" stroke-width="2"/>

  <!-- ================= EMBLEM BADGE (X: 30..290, Y: 30..290) ================= -->
  <g transform="translate(30, 30) scale(0.5078)">
    <circle cx="256" cy="256" r="250" fill="#060C14"/>
    <circle cx="256" cy="256" r="232" fill="none" stroke="url(#neonCyan2)" stroke-width="8" filter="url(#neonGlow2)"/>
    <circle cx="256" cy="256" r="206" fill="none" stroke="url(#neonCyan2)" stroke-width="5" stroke-opacity="0.9" filter="url(#neonGlow2)"/>

    <!-- Amber Circuit Geometry on Back / Neck -->
    <g stroke="url(#amberGold2)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polygon points="120,296 150,268 136,336 102,328" fill="#F59E0B" fill-opacity="0.25"/>
      <polygon points="136,336 172,306 168,368 130,366" fill="#D97706" fill-opacity="0.2"/>
      <polygon points="168,368 206,326 218,396 174,402" fill="#FBBF24" fill-opacity="0.25"/>
      <polygon points="218,396 242,346 264,424 230,424" fill="#F59E0B" fill-opacity="0.2"/>

      <path d="M 326 312 L 352 334 L 316 352 Z" fill="#F59E0B" fill-opacity="0.3"/>
      <path d="M 316 352 L 348 376 L 310 408 L 292 376 Z" fill="#F59E0B" fill-opacity="0.2"/>
      <path d="M 292 376 L 318 438 L 278 432 Z" fill="#F59E0B" fill-opacity="0.15"/>

      <path d="M 298 144 L 342 162 L 372 178" stroke-width="3"/>
      <polygon points="320,154 346,164 332,176 308,166" fill="#F59E0B" fill-opacity="0.35"/>
    </g>

    <!-- Glowing Amber Eye -->
    <g>
      <path d="M 272 176 C 290 174 316 182 328 198 C 304 206 284 200 272 176 Z" 
            fill="none" stroke="url(#amberGold2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 284 186 C 298 184 314 190 318 196 C 304 200 292 196 284 186 Z" fill="#FDE047"/>
    </g>

    <!-- Main Cyber Beaver Head Neon Outlines -->
    <g stroke="url(#neonCyan2)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow2)">
      <path d="M 178 192 C 146 220 114 262 98 316 C 88 348 94 374 116 408 C 140 436 180 448 244 452"/>
      <path d="M 166 182 C 158 148 182 126 206 142 C 220 152 222 170 216 184"/>
      <path d="M 180 172 C 174 156 186 144 198 152 C 206 158 206 168 200 176" stroke="url(#amberGold2)" stroke-width="3.5"/>
      <path d="M 216 184 C 238 154 286 132 344 138 C 374 142 402 156 422 178"/>
      <path d="M 422 178 C 428 184 430 196 420 206 C 412 214 402 216 394 216"/>

      <path d="M 394 216 C 414 208 428 220 424 234 C 420 248 402 254 386 250 C 378 248 372 242 370 236 C 368 224 378 214 394 216 Z" 
            fill="#06121E" stroke="url(#neonCyan2)" stroke-width="5"/>

      <path d="M 370 236 C 354 246 340 262 344 282 C 348 296 362 304 380 306"/>
      <path d="M 380 306 L 358 310"/>
      <path d="M 238 210 L 222 248 L 246 244 L 220 286 L 246 278 L 208 334"/>
      <path d="M 334 336 C 314 366 282 392 252 414 C 236 426 218 438 198 444"/>
    </g>

    <!-- Teeth -->
    <g filter="url(#neonGlow2)">
      <polygon points="364,310 378,308 374,342 360,344" fill="#FFFFFF" stroke="url(#neonCyan2)" stroke-width="3.5"/>
      <polygon points="380,308 394,306 390,338 376,340" fill="#FFFFFF" stroke="url(#neonCyan2)" stroke-width="3.5"/>
      <line x1="377" y1="308" x2="375" y2="341" stroke="#06121E" stroke-width="2.5"/>
    </g>

    <!-- Whiskers -->
    <g stroke="url(#neonCyan2)" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow2)">
      <line x1="362" y1="248" x2="236" y2="238"/>
      <line x1="368" y1="258" x2="248" y2="268"/>
      <line x1="372" y1="270" x2="268" y2="304"/>
      <line x1="366" y1="278" x2="294" y2="332"/>
      <line x1="392" y1="246" x2="442" y2="252"/>
      <line x1="394" y1="256" x2="446" y2="272"/>
      <line x1="388" y1="266" x2="432" y2="296"/>
    </g>
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <text x="320" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="84" letter-spacing="4" fill="#FFFFFF">BEAVER</text>
  <text x="730" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="84" letter-spacing="4" fill="url(#osCyan)" filter="url(#neonGlow2)">OS</text>

  <line x1="322" y1="192" x2="880" y2="192" stroke="url(#neonCyan2)" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow2)"/>

  <text x="324" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="22" letter-spacing="6" fill="#94A3B8">RESILIENT BARE-METAL MICRO-KERNEL</text>

  <!-- Badges -->
  <g transform="translate(324, 252)">
    <rect x="0" y="0" width="90" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="45" y="17" font-family="monospace" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">x86_64</text>

    <rect x="100" y="0" width="130" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="165" y="17" font-family="monospace" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle">RING 3 SANDBOX</text>

    <rect x="240" y="0" width="120" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="300" y="17" font-family="monospace" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">POSIX SYSCALLS</text>

    <rect x="370" y="0" width="100" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="420" y="17" font-family="monospace" font-size="12" font-weight="700" fill="#00E5FF" text-anchor="middle">BEAVERFS</text>
  </g>
</svg>

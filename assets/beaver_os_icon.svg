<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>

    <!-- Ring Glow Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Beaver Amber/Bronze Gradient -->
    <linearGradient id="beaverAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Beaver Deep Fur Gradient -->
    <linearGradient id="beaverDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4"/>

  <!-- Outer Architectural Micro-Kernel Protection Rings (Ring 0 to Ring 3) -->
  <!-- Ring 3 (Userland Isolation) -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.85" stroke-dasharray="120 18 40 18 80 18"/>
  <circle cx="256" cy="256" r="212" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Geometric Beaver Silhouette -->
  <!-- Left Ear -->
  <path d="M 172 176 C 148 140 152 110 180 114 C 200 117 210 138 214 162 Z" 
        fill="url(#beaverDeep)" stroke="#B45309" stroke-width="3"/>
  <path d="M 176 166 C 160 144 164 126 182 128 C 194 130 198 144 200 158 Z" 
        fill="#F59E0B" opacity="0.6"/>

  <!-- Right Ear -->
  <path d="M 340 176 C 364 140 360 110 332 114 C 312 117 302 138 298 162 Z" 
        fill="url(#beaverDeep)" stroke="#B45309" stroke-width="3"/>
  <path d="M 336 166 C 352 144 348 126 330 128 C 318 130 314 144 312 158 Z" 
        fill="#F59E0B" opacity="0.6"/>

  <!-- Beaver Head Shape (Modern Geometric Polygon / Shield) -->
  <!-- Main Head Contour -->
  <path d="M 198 156 
           C 230 146 282 146 314 156 
           C 354 172 376 214 380 256 
           C 384 298 360 340 336 366 
           C 298 404 214 404 176 366 
           C 152 340 128 298 132 256 
           C 136 214 158 172 198 156 Z" 
        fill="url(#beaverAmber)" stroke="#FBBF24" stroke-width="3"/>

  <!-- Cheeks Shadow / 3D Contours -->
  <path d="M 134 266 C 146 324 178 362 214 382 C 180 360 150 320 142 270 Z" fill="#92400E" opacity="0.45"/>
  <path d="M 378 266 C 366 324 334 362 298 382 C 332 360 362 320 370 270 Z" fill="#92400E" opacity="0.45"/>

  <!-- Crown / Forehead Chevron (Precision Architecture Mark) -->
  <polygon points="256,162 278,206 256,220 234,206" fill="url(#beaverDeep)"/>
  <polygon points="256,172 270,202 256,212 242,202" fill="#00E5FF" opacity="0.85" filter="url(#cyanGlow)"/>

  <!-- Eyes (Minimalist, Focused, Tech) -->
  <!-- Left Eye -->
  <circle cx="206" cy="232" r="14" fill="#0F172A"/>
  <circle cx="208" cy="230" r="11" fill="#0284C7"/>
  <circle cx="210" cy="228" r="5" fill="#00E5FF"/>
  <circle cx="212" cy="226" r="2" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <circle cx="306" cy="232" r="14" fill="#0F172A"/>
  <circle cx="304" cy="230" r="11" fill="#0284C7"/>
  <circle cx="302" cy="228" r="5" fill="#00E5FF"/>
  <circle cx="300" cy="226" r="2" fill="#FFFFFF"/>

  <!-- Snout / Muzzle (Clean Rounded Geometry) -->
  <ellipse cx="256" cy="300" rx="64" ry="44" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>

  <!-- Nose (Stylized Inverted Triangle) -->
  <path d="M 238 274 C 248 270 264 270 274 274 C 278 284 266 296 256 298 C 246 296 234 284 238 274 Z" 
        fill="#0F172A"/>
  <circle cx="252" cy="276" r="2" fill="#94A3B8"/>

  <!-- Mouth Seam -->
  <path d="M 256 298 L 256 316" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 234 316 C 244 322 256 322 256 316 C 256 322 268 322 278 316" 
        stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Signature Beaver Builder Teeth (Crisp Iconic White Incisors) -->
  <g>
    <!-- Left Tooth -->
    <path d="M 243 320 L 254 320 L 254 348 C 254 350 252 352 249 352 L 243 352 C 241 352 240 350 240 348 L 240 323 C 240 321 241 320 243 320 Z" 
          fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
    <!-- Right Tooth -->
    <path d="M 258 320 L 269 320 C 271 320 272 321 272 323 L 272 348 C 272 350 271 352 269 352 L 263 352 C 260 352 258 350 258 348 Z" 
          fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  </g>

  <!-- High-Tech Whiskers (Minimalist Precision Lines) -->
  <!-- Left Whiskers -->
  <line x1="184" y1="292" x2="132" y2="284" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="182" y1="304" x2="124" y2="306" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="186" y1="316" x2="136" y2="328" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Right Whiskers -->
  <line x1="328" y1="292" x2="380" y2="284" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="330" y1="304" x2="388" y2="306" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="326" y1="316" x2="376" y2="328" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Digital Water / Dam Base (Sleek Curving Cyan Waves representing the Beaver Foundation) -->
  <path d="M 120 408 
           C 168 392 216 418 256 408 
           C 296 398 344 424 392 408
           C 424 430 380 448 340 442
           C 296 436 256 448 212 442
           C 168 436 100 432 120 408 Z" 
        fill="url(#cyanGrad)" opacity="0.9" filter="url(#cyanGlow)"/>

  <path d="M 160 432 C 208 424 256 438 304 428 C 336 422 352 434 336 444 C 296 454 256 450 216 452 C 180 454 150 442 160 432 Z" 
        fill="#FFFFFF" opacity="0.5"/>
</svg>
